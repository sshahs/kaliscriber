name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an official release (tag v<versionName>) from this build
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: app/libs
          key: sherpa-onnx-${{ hashFiles('app/build.gradle.kts') }}

      # A stable signing key lets new builds install as updates over old ones. The key comes from the
      # KALISCRIBER_KEYSTORE_BASE64 / KALISCRIBER_KEYSTORE_PASSWORD secrets. Without them a throwaway CI
      # key is kept in the Actions cache so builds still work, but the cache can drop it at any time
      # (it did once, and updates stopped installing), so releases need the secrets and every APK is
      # checked against .github/signing-cert-sha256 before it is published.
      - name: Restore CI signing key
        uses: actions/cache@v4
        with:
          path: ~/.kaliscriber/signing.jks
          key: kaliscriber-signing-v1

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KALISCRIBER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KALISCRIBER_KEYSTORE_PASSWORD }}
          PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          mkdir -p ~/.kaliscriber
          if [ -z "$KEYSTORE_BASE64" ] && [ "$PUBLISHING" = "true" ]; then
            echo "::error::Releases must be signed with the permanent key: add the KALISCRIBER_KEYSTORE_BASE64 and KALISCRIBER_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.kaliscriber/release.jks
            echo "KALISCRIBER_KEYSTORE=$HOME/.kaliscriber/release.jks" >> "$GITHUB_ENV"
            echo "KALISCRIBER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            if [ ! -f ~/.kaliscriber/signing.jks ]; then
              keytool -genkeypair -keystore ~/.kaliscriber/signing.jks -storepass kaliscriber-ci -keypass kaliscriber-ci \
                -alias kaliscriber -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=KaliScriber CI build"
            fi
            echo "KALISCRIBER_KEYSTORE=$HOME/.kaliscriber/signing.jks" >> "$GITHUB_ENV"
            echo "KALISCRIBER_KEYSTORE_PASSWORD=kaliscriber-ci" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (core)
        run: ./gradlew :core:test --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Name the release APKs
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p release
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "release/kaliscriber-${VERSION}-build${{ github.run_number }}-${abi}.apk"
          done
          ls -la release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Phones only install an update signed with the same key as the installed app.
      - name: Check signing certificate
        id: cert
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          EXPECTED=$(tr -d '[:space:]' < .github/signing-cert-sha256)
          for f in release/*.apk; do
            ACTUAL=$("$APKSIGNER" verify --print-certs "$f" | grep -m1 'certificate SHA-256 digest' | sed 's/.*digest: //')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::warning::$(basename "$f") is signed with $ACTUAL, not the release key $EXPECTED. It won't install as an update and won't be published."
              echo "match=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "match=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kaliscriber-apks
          path: release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cert.outputs.match == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KaliScriber ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          prerelease: true
          files: release/*.apk
          body: |
            Android APKs built from ${{ github.sha }}.
            Most phones: the `arm64-v8a` APK. Older 32-bit phones: `armeabi-v7a`. Emulators: `x86_64`. Not sure: `universal`.
            Install by opening the APK on your phone (allow installs from your browser or file manager).

      # An official release, tagged v<versionName>, with notes from .github/release-notes/v<versionName>.md.
      # Run the workflow manually with "publish" ticked, or push a v* tag matching versionName.
      - name: Check release version
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${{ steps.apk.outputs.version }}" >&2
            exit 1
          fi
          test -f ".github/release-notes/${TAG}.md"
          if [ "${{ steps.cert.outputs.match }}" != "true" ]; then
            echo "::error::The APKs aren't signed with the release key, so they wouldn't install as updates." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish version release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: KaliScriber ${{ steps.apk.outputs.version }}
          prerelease: false
          make_latest: true
          files: release/*.apk
          body_path: .github/release-notes/${{ steps.release.outputs.tag }}.md
